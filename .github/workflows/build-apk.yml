name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OTGPrintHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OTGPrintHub-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  # Optional: Sign release APK if secrets are configured
  sign-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Uncomment and configure when you have a keystore:
    # env:
    #   KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
    #   KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    #   KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    #   STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - name: Skip signing (no keystore configured)
        run: echo "Signed APK step skipped. Configure KEYSTORE_FILE secret to enable signing."
